# Worktrunk project hooks. Each worktree gets its own library copy and ports; see
# scripts/worktree. The scripts run from the main checkout, so branches made before
# they existed still get them.

# blocking, in order: ports and .local/, then pnpm install + make generate, all
# before wt switch returns
[[pre-start]]
setup = "{{ primary_worktree_path }}/scripts/worktree setup {{ worktree_path }}"

[[pre-start]]
deps = "{{ primary_worktree_path }}/scripts/worktree deps {{ worktree_path }}"

[pre-remove]
stopped = "{{ primary_worktree_path }}/scripts/worktree check-stopped {{ worktree_path }}"
