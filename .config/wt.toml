# Worktrunk project hooks. Each worktree gets its own library copy and ports; see
# scripts/worktree. The scripts run from the main checkout, so branches made before
# they existed still get them.

# blocking: ports and .local/ alongside pnpm install + make generate, all before
# wt switch returns
[[pre-start]]
init = "{{ primary_worktree_path }}/scripts/worktree init {{ worktree_path }}"

[pre-remove]
stopped = "{{ primary_worktree_path }}/scripts/worktree check-stopped {{ worktree_path }}"

# background, once pre-start is done: a detached tmux session with server, ui and the
# assistant and worker Claude sessions (scripts/tmux-dev). Attach with: scripts/tmux-dev up
[post-start]
tmux = "{{ primary_worktree_path }}/scripts/tmux-dev up --detach {{ worktree_path }}"
